[build]
  publish = "site"
  command = "python3 tools/copy_data.py && python3 tools/features/publish.py && python3 build/growth-pages/publish.py && python3 tools/optimize_site.py && python3 tools/press_subdomain.py"

# Speed on weak networks (see tools/optimize_site.py and site/sw.js).
# Fonts and the map libraries never change under the same name, so phones may keep them.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/assets/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# The service worker must always be checked for a new version.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
