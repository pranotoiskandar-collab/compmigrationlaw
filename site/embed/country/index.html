<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IMR country widget · Institute for Migrant Rights</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://theimr.org/partners/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&amp;display=swap">
<script data-goatcounter="https://theimr.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<style>
html,body{margin:0;background:#FFFFFF;color:#172D24;font:15px/1.45 'Figtree',system-ui,sans-serif}
.box{display:flex;flex-direction:column;min-height:100vh;box-sizing:border-box;border-top:4px solid #1E6B4A}
#w{flex:1;padding:12px 14px 4px}
h1{margin:0;font-size:19px;line-height:1.25;font-weight:700}
h2{margin:14px 0 4px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:#1E6B4A}
.n{margin:4px 0 0;color:#3D5A4D;font-size:13.5px}
.i{padding:6px 0;border-bottom:1px solid #DCE8E1}.i p{margin:0}.i small{color:#3D5A4D}
.i i{color:#3D5A4D;font-size:12.5px}.s{color:#2E493D;font-size:14px;margin-top:2px!important}
a{color:#1E6B4A}a:hover{color:#134A33}
.tel{display:inline-block;padding:3px 9px;border-radius:999px;background:#1E6B4A;color:#FFFFFF!important;text-decoration:none;font-weight:600;font-size:13.5px}
.more{display:flex;flex-wrap:wrap;gap:4px 14px;margin:12px 0 4px;font-weight:600}
#badge{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:10px 14px;background:#EEF4F0;border-top:1px solid #B2C7BC}
#badge img{display:block}#badge small{flex:1 1 160px;color:#3D5A4D;font-size:12px;line-height:1.35}
</style>
</head>
<body>
<div class="box"><div id="w" aria-live="polite"><p>…</p></div><div id="badge"></div></div>
<script src="embed.js"></script>
</body>
</html>
